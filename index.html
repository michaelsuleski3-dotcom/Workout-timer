<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Workout Timer</title>

    <link rel="stylesheet" href="style.css">

    <meta name="theme-color" content="#111111">
</head>

<body>

    <main class="timer-app">

        <h1 id="phase">READY</h1>

        <div id="timer">0:30</div>

        <div class="time-settings">

            <div class="time-setting">

                <span class="setting-label">
                    Workout
                </span>

                <button
                    id="work-minus"
                    type="button"
                >
                    −
                </button>

                <span id="work-time-display">
                    30 sec
                </span>

                <button
                    id="work-plus"
                    type="button"
                >
                    +
                </button>

            </div>

            <div class="time-setting">

                <span class="setting-label">
                    Rest
                </span>

                <button
                    id="rest-minus"
                    type="button"
                >
                    −
                </button>

                <span id="rest-time-display">
                    20 sec
                </span>

                <button
                    id="rest-plus"
                    type="button"
                >
                    +
                </button>

            </div>

        </div>

        <div class="controls">
            <button id="start-button">START</button>
            <button id="pause-button">PAUSE</button>
            <button id="reset-button">RESET</button>
        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
